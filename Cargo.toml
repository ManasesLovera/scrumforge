[package]
name = "scrumforge"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.4"
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = "18.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net"] }
